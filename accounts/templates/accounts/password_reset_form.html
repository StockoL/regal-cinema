{% extends 'base.html' %}

{% block title %}Reset your password{% endblock %}

{% block content %}
<div class="wrapper region">
  <div class="center flow">
    <h1>Reset your password</h1>
    <p>Enter the email address you registered with, and we'll send a link to choose a new password.</p>
    <form class="flow" method="post" novalidate>
      {% csrf_token %}
      {{ form }}
      <button class="button" type="submit" data-variant="primary">Send the link</button>
    </form>
  </div>
</div>
{% endblock %}
