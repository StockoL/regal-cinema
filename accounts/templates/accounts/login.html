{% extends 'base.html' %}

{% block title %}Log in{% endblock %}

{% block content %}
<div class="wrapper region">
  <div class="center flow">
    <h1>Log in</h1>
    <form class="flow" method="post" novalidate>
      {% csrf_token %}
      {{ form }}
      <input type="hidden" name="next" value="{{ next }}">
      <button class="button" type="submit" data-variant="primary">Log in</button>
    </form>
    <p>New to Regal Cinema? <a href="{% url 'accounts:register' %}">Create an account</a></p>
  </div>
</div>
{% endblock %}
